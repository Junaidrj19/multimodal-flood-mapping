name: m5_kuro_sar_unet_mps_bounded
version: 1.0.0
status: ready_to_run
description: First supervised flood segmentation baseline. Kuro Siwo labelled partition
  01, SAR only, SL1 pre-event and MS1 post-event, VV and VH, linear sigma0 clipped
  at 0.15 by the M4 adapter. Three semantic classes with stored label 3 as the ignore
  index.
primary_metric: iou_flood_class
dataset:
  id: kuro_siwo
  root_env: FLOODMAP_KURO_SIWO_ROOT
  root: null
  train_split: train
  validation_split: validation
  channels:
  - pre_vv
  - pre_vh
  - post_vv
  - post_vh
  representation: linear_sigma0
  ignore_index: 3
  limit_train: 32
  limit_validation: 8
reprojection:
  enabled: true
  resolution_m: 10.0
  tile_size: 224
  sar_resampling: bilinear
  label_resampling: nearest
  nodata_mode: strict
quarantine:
  enabled: true
  path: null
  require_policy_file: true
dataloader:
  batch_size: 1
  num_workers: 0
  shuffle_train: true
  drop_last: false
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
model:
  architecture: unet
  in_channels: 4
  num_classes: 3
  base_channels: 32
  depth: 4
  pretrained_weights: null
loss:
  name: cross_entropy
  ignore_index: 3
  class_weights: null
optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.0
augmentation:
  enabled: false
  horizontal_flip: false
  vertical_flip: false
  rotate_90: false
  radiometric: false
normalisation:
  enabled: true
  statistics_path: artifacts/statistics/kuro_sar_fitted
  required_kind: fitted
  allow_development_statistics: false
checkpoint:
  directory: runs
  monitor: val_iou_flood_class
  mode: max
  selection_split: validation
  save_last: true
training:
  seed: 20261008
  deterministic: true
  epochs: 1
  device: mps
  log_every_n_steps: 50
  max_steps_per_epoch: null
