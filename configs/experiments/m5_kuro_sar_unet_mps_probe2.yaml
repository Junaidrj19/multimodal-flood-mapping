name: m5_kuro_sar_unet_mps_probe2
version: 1.0.0
status: ready_to_run
description: Second bounded MPS probe. Identical dataset contract, quarantine policy,
  fitted statistics, model, loss, metrics and canonical reprojection to m5_kuro_sar_unet_mps_bounded;
  the only differences are the training subset and its length. Trains on the 256-tile
  deterministic selection in artifacts/selections/m5_mps_probe2.json (seed 20261008,
  proportional largest-remainder allocation of 181/50/25 across training activations
  1111004/1111005/1111006) for 3 epochs, and validates on all 19 eligible validation
  samples. Bounded probe, not a performance measurement.
primary_metric: iou_flood_class
dataset:
  id: kuro_siwo
  root_env: FLOODMAP_KURO_SIWO_ROOT
  root: null
  train_split: train
  validation_split: validation
  channels:
  - pre_vv
  - pre_vh
  - post_vv
  - post_vh
  representation: linear_sigma0
  ignore_index: 3
  # limit_train stays null and MUST stay null: it is mutually exclusive with
  # train_sample_manifest, because truncating the manifest to a sorted prefix
  # would undo the activation balance the selection exists to provide.
  limit_train: null
  # null, not 19: the cap is a development truncation, and hard-coding the
  # current eligible count would silently become a truncation if the corpus
  # changed. All eligible validation samples are used.
  limit_validation: null
  train_sample_manifest: artifacts/selections/m5_mps_probe2.json
reprojection:
  enabled: true
  resolution_m: 10.0
  tile_size: 224
  sar_resampling: bilinear
  label_resampling: nearest
  nodata_mode: strict
quarantine:
  enabled: true
  path: null
  require_policy_file: true
dataloader:
  batch_size: 1
  num_workers: 0
  shuffle_train: true
  drop_last: false
  pin_memory: false
  persistent_workers: false
  prefetch_factor: null
model:
  architecture: unet
  in_channels: 4
  num_classes: 3
  base_channels: 32
  depth: 4
  pretrained_weights: null
loss:
  name: cross_entropy
  ignore_index: 3
  class_weights: null
optimizer:
  name: adam
  learning_rate: 0.001
  weight_decay: 0.0
augmentation:
  enabled: false
  horizontal_flip: false
  vertical_flip: false
  rotate_90: false
  radiometric: false
normalisation:
  enabled: true
  statistics_path: artifacts/statistics/kuro_sar_fitted
  required_kind: fitted
  allow_development_statistics: false
checkpoint:
  # Base directory only. run_training appends the experiment name to this, so
  # the run is launched with `--run-dir runs/m5_mps_probe2` to land artifacts
  # exactly there — the same pattern the existing bounded MPS runs used.
  directory: runs
  monitor: val_iou_flood_class
  mode: max
  selection_split: validation
  save_last: true
training:
  seed: 20261008
  deterministic: true
  epochs: 3
  device: mps
  log_every_n_steps: 50
  max_steps_per_epoch: null
