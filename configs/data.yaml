        hand_labelled_flood_chips: 446
        permanent_water_chips: 814
        permanent_water_chips_are_a_label_class: false
        per_sample_rasters: ["S1Hand", "S2Hand", "LabelHand", "S1OtsuLabelHand", "JRCWaterHand"]
        s1_speckle_filtered: false
        s1_clipped: false
        s1_normalised: false
        s1_observed_db_range: [-50, 20]
        split_type: "event_based"
        events: 11                 # 12 entries in the metadata; Colombia added later
        path: null                 # TODO: populate when actually acquired
        # ---------------------------------------------------------------------
        # C11 — this dataset is external to the repository, by policy.
        # ---------------------------------------------------------------------
        repository_redistribution_allowed: false
        external_to_repository: true
        local_delivery_inspected: false
        # ---------------------------------------------------------------------
        # C8 — DATASET CAPABILITY MODEL. Same shape as Kuro Siwo's, different
        # values. This is the point of the model: the two corpora disagree on
        # six of these capabilities, and a single boolean or a shared enum
        # could not express that.
        # ---------------------------------------------------------------------
        capabilities:
          imagery:
            sar: true
            optical: true
            # The hard structural difference. Sen1Floods11 is a single
            # post-event acquisition, so there is no pre-event counterpart to
            # pair with and no change signal to supervise.
            pre_event: false
            post_event: true
            temporal_pair: false
            change_features: false
          terrain:
            dem_bundled: false
            dem_available_to_canonical_sample: false
            slope_bundled: false
            slope_trusted: false
          labels:
            flood: true
            # JRCWaterHand ships alongside the label, but it is a separate
            # JRC-derived raster, not a class inside LabelHand. LabelHand is
            # binary in every chip.
            permanent_water: false
            separates_flood_from_permanent_water: false
            multiclass_segmentation: false
            binary_segmentation: true
            nodata:
              present: true
              value: -1
              form: "in_band_negative_sentinel"
          sar_representation:
            native: "decibel"
            native_is_decibel: true
            nodata_value: null        # no published SAR nodata convention
            non_negative: false       # dB is signed; observed ~-50 to +20
            dtype: "float32"
            source_speckle_filtered: false
            source_clipped: false
          optical_representation:
            processing_level: "L1C"
            quantity: "TOA reflectance"
            scale_factor: 10000
            dtype: "int16"
            band_count: 13
            quality_mask_included: false
            # Kuro Siwo has no optical branch at all, so this block exists on
            # one corpus only. The capability model must tolerate that.
            boa_surface_reflectance: false
          splits:
            type: "event_based"
            authoritative_unit: "event"
            official_split_is_authoritative: true
        # ---------------------------------------------------------------------
        # FORBIDDEN CAPABILITY UPGRADES — machine-readable so the prohibition
        # is testable rather than a comment someone has to remember.
        #
        # Every entry here is a capability that Sen1Floods11 does NOT have and
        # that an adapter must not synthesise. The failure mode this prevents
        # is real and tempting: faking a pre-event image (by reusing the
        # post-event one, or by substituting a neighbouring chip) would let one
        # shared code path serve both corpora, and would silently produce a
        # change feature that is identically zero or pure noise.
        # ---------------------------------------------------------------------
        forbidden_capability_upgrades:
          - "pre_event imagery"
          - "temporal pairs"
          - "change detection features"
          - "permanent-water vs flood separation"
          - "BOA surface reflectance"
          - "terrain / DEM features"
          - "Kuro-style 3-class semantics"
        # ---------------------------------------------------------------------
        # C14 — SEN1FLOODS11 ADAPTER CONTRACT INVARIANTS.
        # Contract only; no adapter exists. Sen1Floods11 has no local delivery,
