        # against the real product before the adapter is trusted.
        # ---------------------------------------------------------------------
        adapter_invariants:
          - "1. S1 is decibel, never linear sigma0"
          - "2. VV and VH are both available"
          - "3. S2 is TOA reflectance scaled by 10000"
          - "4. labels are binary {0,1}"
          - "5. label value -1 is nodata"
          - "6. no permanent-water vs flood semantic separation exists"
          - "7. post-event only"
          - "8. no pre-event counterpart may be synthesised"
          - "9. no change features may be derived"
          - "10. no DEM capability is assumed"
          - "11. source CRS EPSG:4326 is retained, never overwritten"
          - "12. source transform is retained"
          - "13. source spacing is ~0.000090 degrees, never universal 10 m ground"
          - "14. no artificial Kuro Siwo semantics are imposed"
          - "15. the dataset stays external to this repository until its licence is resolved"

# =============================================================================
# M4 CONTRACT FREEZE — decisions C1-C14
#
# This block is the machine-readable half of docs/m4-architecture-decision.md
# §10. Every decision M4 needs in order to start is recorded here or in the
# per-dataset `capabilities` / `adapter_invariants` blocks above (C8, C13, C14).
#
# WHY IT IS TOP-LEVEL AND NOT UNDER `production:`
# `production:` is a closed set of five permitted data sources, asserted
# exactly by tests/test_data_boundary.py. This block describes how those
# sources are PROCESSED, not a sixth source, so putting it there would both
# break that invariant and misrepresent what it is.
#
# WHAT "FROZEN" MEANS HERE
# A frozen decision is one M4 may rely on without re-litigating it. It does NOT
# mean the underlying science is settled: C4 freezes a DISCLOSED MISMATCH, and
# C6 freezes a criterion whose VALUE is still blocked on validation data. Those
# distinctions are recorded per-decision rather than averaged away.
#
# Validated by src/floodmap/utils/contract.py with extra="forbid", so a
# misspelled key in this block fails loudly instead of being ignored.
# =============================================================================
m4_contract:
  version: "1.0.0"
  frozen_at: "2026-10-08"
  # The canonical sample contract is documented, not implemented: M4 owns the
  # adapter. See docs/m4-architecture-decision.md §11.
  sample_contract_reference: "docs/m4-architecture-decision.md#11"

  # ---------------------------------------------------------------------------
  # C1 — CANONICAL PROJECTED CRS
  #
  # A single global projected EPSG code is NOT defensible for this project and
  # is deliberately not chosen. The Kuro Siwo corpus spans roughly -18 deg to
  # +60 deg latitude across all longitudes; no one projected CRS keeps metre
  # fidelity over that extent. EPSG:3857 is metre-LABELLED but not metre-TRUE
  # (that is exactly the defect recorded against the source), so inheriting it
  # as the target would preserve the bug rather than fix it.
  #
  # The decision is therefore a RULE plus a family, applied per sample. Inside
  # a UTM zone the scale error is under ~0.1%, which is what makes areas,
  # lengths and slope kernels meaningful.
  #
  # This is the TARGET grid CRS. Source CRS is recorded independently on each
  # dataset (`source_crs`) and is never overwritten by this choice.
  # ---------------------------------------------------------------------------
  canonical_crs:
    is_target_not_source: true
    family: "WGS 84 / UTM"
    units: "metre"
    epsg_pattern: "EPSG:326xx (north) | EPSG:327xx (south)"
    single_global_epsg_chosen: false
    single_global_epsg_rationale: >-
      The training corpus spans ~-18 to +60 degrees latitude across all
      longitudes. No single projected CRS holds metre fidelity over that
      extent, so the canonical CRS is a per-sample rule rather than a constant.
    zone_rule: "UTM zone and hemisphere derived from the sample's own centroid"
    zone_sources:
      kuro_siwo: "info.json.geom centroid, reprojected from EPSG:3857"
      sen1floods11: "chip centroid in EPSG:4326"
      production: "AOI centroid in EPSG:4326"
    # Recorded as a DERIVED EXPECTATION, not a frozen value: `aoi` is
    # deliberately null and the only candidate geometry on disk
    # (`aoi.geojson`) has no provenance (docs/dataset-registry.md §1.6).
    production_expected_epsg: "EPSG:32645"
    production_expected_epsg_status: "DERIVED(pending AOI geometry) — not pinned"
    forbid_geographic_crs_for_canonical_grid: true

  # ---------------------------------------------------------------------------
  # C2 — CANONICAL GSD / TARGET RESOLUTION
  #
  # 10.0 m true ground, in the canonical UTM CRS. This is a TARGET, and it is
  # the native ground resolution of NO dataset in this project.
  #
  # Why 10 m and not one of the measured Kuro spacings:
  #   1. The production inference source (Sentinel-1 IW GRDH) is natively 10 m,
  #      so the path we actually have to serve needs no resampling at all.
  #      Choosing 8.7 m would resample the inference input to match a training
  #      artefact, which is the wrong direction to compromise.
  #   2. Every MEASURED Kuro spacing (8.736-9.798 m) is FINER than 10 m, so
  #      resampling to 10 m is a mild coarsening in every measured case. It
  #      never manufactures detail that the source did not contain.
  #   3. Sen1Floods11's ~0.000090 deg is ~10 m north-south and finer than 10 m
  #      east-west away from the equator: same direction, same argument.
  #
  # The honest cost: the 40 unmeasured activations reach ~60N, where 10
  # projected units is ~5 m of ground, so harmonising those to 10 m is a ~2x
  # coarsening and a real loss of resolution. That is a disclosed consequence
  # of this choice, not a side effect to discover later.
  # ---------------------------------------------------------------------------
  canonical_gsd:
    value: 10.0
    units: "metre"
    measured_in: "true ground metres on the canonical UTM grid"
    is_native_resolution_of_any_dataset: false
    rationale: >-
      Matches the native 10 m pixel spacing of the production Sentinel-1 IW
      GRDH inference source, so the served path needs no resampling; and every
      measured Kuro Siwo true spacing is finer than 10 m, so the training path
      is coarsened rather than interpolated up.
    relationship_to_kuro_source: >-
      Kuro Siwo source spacing is 10 PROJECTED units in EPSG:3857, measured as
      8.736-9.798 m true ground across five activations. The adapter resamples
      per activation from that activation's own measured spacing; there is no
      corpus-wide source GSD.
    relationship_to_sen1floods11_source: >-
      Sen1Floods11 source spacing is ~0.000090 degrees in EPSG:4326, which is
      ~10 m north-south everywhere and shrinks with cos(latitude) east-west.
      Spacing is derived per chip, never assumed.
    disclosed_cost: >-
      Unmeasured activations reach ~60N where 10 projected units is ~5 m of
      ground; harmonising those to 10 m is roughly a 2x coarsening.

  # ---------------------------------------------------------------------------
  # C3 — RESAMPLING METHODS
  #
  # One method per raster TYPE. A single global method is forbidden because the
  # types fail differently: bilinear on a class label invents classes that
  # never existed (a 0/2 boundary becomes 1 = "Permanent Waters"), and nearest
  # on continuous backscatter throws away the averaging that makes a coarsened
  # pixel physically meaningful.
  #
  # The SAR domain condition is the subtle one and is binding: SAR must be
  # resampled in LINEAR POWER, before the dB conversion. Averaging decibels
  # averages logarithms, which is not the mean of the underlying power and is
  # biased low. This is also why C10 places the clip before the conversion.
  # ---------------------------------------------------------------------------
  resampling:
    forbid_generic_method: true
    forbid_default: true
    methods:
      continuous_sar: "bilinear"
      continuous_optical: "bilinear"
      categorical_label: "nearest"
      binary_validity_mask: "nearest"
      dem: "bilinear"
    sar_resample_domain: "linear_power"
    sar_resample_before_db_conversion: true
    sar_resample_domain_rationale: >-
      Averaging decibels averages logarithms, which is not the mean of the
      underlying power and is biased low. Resample linear sigma0, then convert.
    categorical_rationale: >-
      Nearest neighbour cannot produce a value absent from the source, so it
      cannot invent a class at a boundary. `mode` was considered and rejected:
      it shifts class prevalence near boundaries by an amount that depends on
      the resample ratio, and under C1/C2 that ratio varies per activation, so
      label statistics would become a function of geography.
    dem_status: "declared but unused — DEM is excluded from the M4 baseline"

  # ---------------------------------------------------------------------------
  # C4 — SPECKLE POLICY
  #
  # DECISION: our pipeline applies NO speckle filter, on any path.
  #
  # Parity is NOT claimed, and this is the one decision where that must be said
  # plainly. Kuro Siwo arrives already Lee Sigma filtered by its authors and
  # cannot be un-filtered; Sen1Floods11 and our own M2 are unfiltered. So:
  #   - "filter everything to match Kuro" would double-filter Kuro;
  #   - "filter nothing" leaves a real train/serve texture mismatch, because a
  #     CNN reads texture and speckle is texture.
  # There is no option that produces true parity with the corpus we have, so
  # the policy is the honest one (apply nothing, uniformly) and the residual
  # mismatch is disclosed and must be quantified by ablation before any claim
  # about transfer is made.
  #
  # The schema fix matters as much as the policy. Until 2026-10-08
  # `speckle_filter` sat under an unmodelled `sentinel1.steps` block in
  # configs/preprocessing.yaml with pydantic extra="allow", so setting it was a
  # silent no-op: it parsed and was discarded. `steps` and `speckle` are now
  # modelled with extra="forbid" in src/floodmap/preprocessing/config.py.
  # ---------------------------------------------------------------------------
  speckle:
    applied_by_our_pipeline: false
    filter_family: null
    parameters: null
    pipeline_site: null
    parity_established: false
    parity_possible: false
    parity_impossible_reason: >-
      Kuro Siwo is delivered already Lee Sigma filtered and cannot be
      un-filtered, so no setting of our own filter makes the training and
      inference paths identical in texture statistics.
    source_state:
      kuro_siwo: "Lee Sigma, 7x7 window, 3x3 target, sigma 0.9 (applied upstream)"
      sen1floods11: "none"
      production_sentinel1: "none"
    mismatch_disclosed: true
    ablation_required_before_transfer_claim: true
    config_can_be_silently_discarded: false
    config_schema_owner: "src/floodmap/preprocessing/config.py"

  # ---------------------------------------------------------------------------
  # C5 — STATISTICS ARTIFACT
  #
  # Three KINDS of statistics exist and must never be confused:
  #   reference  - published upstream values. Cross-check only.
  #   fitted     - OUR normalisation parameters, from the training split only.
  #   validation - measured on validation data for DRIFT REPORTING only.
  #
  # NO FITTED STATISTICS EXIST. None are invented here. Normalisation METHOD is
  # explicitly NOT part of this frozen contract (configs/segmentation.yaml and
  # configs/features.yaml both keep `normalisation.method: null`); what is
  # frozen is the artifact SCHEMA that M4 must emit when it does fit them.
  #
  # The layout is a SIDECAR PAIR, not one wrapped file, and that is forced by
  # the existing reader: src/floodmap/features/pipeline.py coerces float() over
  # every value of every top-level key in the statistics JSON, so a provenance
  # block inside that file would raise rather than be ignored. Keeping
  # provenance beside the values also matches the repository's established
  # `*_provenance.yaml` convention.
  # ---------------------------------------------------------------------------
  statistics:
    schema_id: "floodmap.statistics/1"
    schema_version: "1.0.0"
    kinds: ["reference", "fitted", "validation"]
    layout: "sidecar_pair"
    values_file: "statistics.json"
    values_shape: "channel_name -> {mean, std}"
    values_shape_rationale: >-
      Flat and float-only, because floodmap.features.pipeline coerces float()
      over every value of every top-level key; an embedded provenance block
      would raise there.
    provenance_file: "statistics_meta.json"
    provenance_required_fields:
      - "schema_id"
      - "schema_version"
      - "kind"
      - "dataset_id"
      - "split"
      - "activations"
      - "channels"
      - "representation"
      - "preprocessing_state"
      - "clip_state"
      - "temporal_role_basis"
      - "aggregation_basis"
      - "n_tiles"
      - "n_valid_pixels"
      - "created_at"
      - "code_version"
    fitted:
      exists: false
      source_split: "kuro_siwo training activations only"
      fitted_from_validation_or_test: false
      path: null
    reference:
      dataset_id: "kuro_siwo"
      usable_as_fitted_normalisation_parameters: false
      cross_check_policy: "tolerance_banded_over_full_training_split"
      cross_check_is_per_raster_equality_gate: false
    validation:
      purpose: "drift reporting only"
      may_be_used_for_normalisation: false
    normalisation_method_is_part_of_this_contract: false
    normalisation_method_status: "DEFERRED to M4; configs keep method: null"

  # ---------------------------------------------------------------------------
  # C6 — THRESHOLD / CHECKPOINT SELECTION CRITERION
  #
  # PRIMARY CRITERION: IoU of the flood class (Kuro Siwo class 2).
  #
  # Why not macro-IoU over {No water, Permanent Waters, Floods}: two of those
  # three classes are easy. "No water" dominates by area and "Permanent
  # Waters" is a largely static, high-contrast target. A macro average over
  # them can rise while flood IoU falls, which would select a checkpoint that
  # is worse at the only thing the product claims to do. Per-class IoU and F1,
  # macro and micro averages, and the full confusion matrix are all still
  # REPORTED (configs/evaluation.yaml) — they are just not selected on.
  #
  # Three split ROLES, kept distinct:
  #   training           - Kuro Siwo train activations. Fitting happens here.
  #   validation         - Kuro Siwo val activations. Selection happens here,
  #                        and only here.
  #   external_validation- Sen1Floods11. Reported, never selected on. It also
  #                        CANNOT be selected on: it is binary, so it cannot
  #                        score the flood-vs-permanent-water distinction that
  #                        the criterion depends on.
  #
  # The criterion is frozen; the VALUE is not available. Only one validation
  # activation (19 tiles) is present locally, and one activation cannot
  # distinguish event-specific behaviour from generalisable behaviour. Any
  # threshold selected in that state is development-only and not reportable.
  # ---------------------------------------------------------------------------
  threshold_selection:
    primary_criterion: "iou_flood_class"
    primary_criterion_class_id: 2
    primary_criterion_class_name: "Floods"
    primary_criterion_rationale: >-
      Flood is the minority class and the product's purpose; a macro average
      over the easy majority and permanent-water classes can improve while
      flood IoU degrades.
    reported_but_not_selected_on:
      - "per_class_iou"
      - "per_class_f1"
      - "macro_iou"
      - "micro_iou"
      - "confusion_matrix"
    selection_split_role: "validation"
    forbid_selection_on_training: true
    forbid_selection_on_test: true
    forbid_selection_on_external_validation: true
    split_roles:
      training: "kuro_siwo train activations"
      validation: "kuro_siwo val activations"
      external_validation: "sen1floods11 hand-labelled chips"
    min_validation_activations_for_a_reportable_threshold: 2
    min_validation_activations_rationale: >-
      A single activation cannot separate event-specific behaviour from
      generalisable behaviour, so a threshold tuned on one event is a property
      of that event. Two distinct activations is the minimum that can show the
      difference at all; it is a floor, not a sufficiency claim.
    validation_activations_available_locally: 1
    value_status: "DEFERRED(blocked on validation data) — see local_subset"
    development_only_until_satisfied: true

  # ---------------------------------------------------------------------------
  # C7 — SPATIAL BUFFER / LEAKAGE
  #
  # DECISION: no additional spatial buffer. 0 m, and that is a decision rather
  # than an unset value.
  #
  # The reason it is not an invented distance: Kuro Siwo's official split
  # assigns WHOLE ACTIVATIONS, so every tile of an activation lands in exactly
  # one split. There is no train/validation tile adjacency anywhere in the
  # corpus for a buffer to separate. A non-zero distance here would be a number
  # with nothing to act on, and would imply a tile-level split we do not have.
  #
  # One honest gap, disclosed rather than closed: activation-level splitting
  # isolates EVENTS, not necessarily GEOGRAPHY. Two activations over the same
  # basin at different dates could sit in different splits and would share
  # terrain, land cover and permanent water. Checking that needs all 45
  # activation geometries; 5 are available. This is a disclosure, not an M4
  # blocker: it cannot make the split worse than it already is, and it is
  # verifiable the moment the geometries arrive.
  # ---------------------------------------------------------------------------
  spatial_isolation:
    additional_buffer_required: false
    spatial_buffer_m: 0
    buffer_is_a_decision_not_an_unset_value: true
    primary_mechanism: "activation_level_partition"
    mechanism_rationale: >-
      Whole activations are assigned to a single split, so no tile from one
      activation can be spatially adjacent to a tile from another split within
      the same event. There is no cross-split adjacency for a buffer to act on.
    assert_disjoint_activation_ids: true
    forbid_sub_activation_split: true
    forbid_sub_activation_split_reason: >-
      A tile-level or pixel-level split inside one activation WOULD create
      cross-split adjacency, at which point a justified buffer distance becomes
      mandatory. Prohibited for M4 rather than left to judgement.
    assert_activation_geometry_disjointness: "PENDING(data)"
    assert_activation_geometry_disjointness_note: >-
      Activation-level splitting isolates events, not geography. Two
      activations over the same basin at different dates could share terrain
      and permanent water across splits. Verifying requires all 45 activation
      geometries; 5 are available locally.

  # ---------------------------------------------------------------------------
  # C9 — OUTPUT NODATA
  #
  # Semantic class IDs and "no information here" are different kinds of thing
  # and get different encodings. A class ID used as nodata makes every
  # downstream count ambiguous: a pixel labelled 0 could mean "we observed dry
  # ground" or "we had nothing to say", and no consumer can tell them apart.
  #
  # Note what 3 is and is not. Upstream, 3 is Kuro Siwo's IN-BAND LABEL nodata
  # sentinel. We deliberately do NOT reuse it for our OUTPUT nodata, even
  # though it is not a semantic class: keeping the input sentinel and the
  # output sentinel distinct means a raster's provenance is readable from its
  # values. 3 appears below only as the loss/metric ignore index, which is an
  # INPUT-side concern.
  # ---------------------------------------------------------------------------
  output_nodata:
    semantic_class_ids: [0, 1, 2]
    class_mask_dtype: "uint8"
    class_mask_nodata: 255
    probability_dtype: "float32"
    probability_nodata: -9999.0
    continuous_nodata: -9999.0
    forbid_semantic_class_id_as_nodata: true
    distinct_from_input_label_sentinel: true
    input_label_sentinel: 3
    loss_and_metrics_ignore_index: 3
    loss_and_metrics_ignore_index_is_an_input_concern: true
    rationale: >-
      255 cannot collide with the semantic classes {0,1,2} nor with the
      upstream input sentinel 3 in a uint8 mask, and -9999.0 is outside the
      legitimate range of every continuous output (decibel backscatter,
      decibel change, probability in [0,1]).
    # Deliberately NOT propagated into configs/features.yaml or
    # configs/preprocessing.yaml by this freeze. Those are M2/M3 artifact
    # contracts with their own unresolved bindings; forcing the value in now
    # would resolve one field of a config that still cannot run, for no gain.
    propagated_to_m2_m3_configs: false
    propagated_to_m2_m3_configs_status: "DEFERRED to those milestones"

  # ---------------------------------------------------------------------------
  # C10 — KURO SIWO CLIP IMPLEMENTATION SITE
  #
  # The clip happens in the ADAPTER, on linear sigma0, BEFORE the dB
  # conversion. One site, stated once.
  #
  # Three representations must not be confused, so they are named separately:
  #   source        - linear sigma0, UNCLIPPED. Observed VV max 901.92.
  #   preprocessing - linear sigma0, clipped at 0.15.
  #   model         - decibel, upper bound 10*log10(0.15) = -8.2391 dB.
  #
  # Clipping in the LINEAR domain rather than in dB is deliberate: 0.15 is the
  # exact published bound, while -8.2391 is a rounded transform of it. Clipping
  # linear-then-converting applies the exact bound; clipping in dB would apply
  # a slightly different one and make the training distribution depend on how
  # many decimals we wrote down.
  #
  # Raw delivered files are never modified. The delivery is NOT pre-clipped, so
  # an adapter that assumed otherwise would train on a distribution thousands
  # of times wider than intended.
  # ---------------------------------------------------------------------------
  clip:
    enabled: true
    domain: "linear_sigma0"
    max_linear: 0.15
    equivalent_db: -8.2391
    equivalent_db_is_recorded_not_applied: true
    site: "dataset_adapter"
    site_detail: "after reading raw linear sigma0, before linear-to-dB conversion"
    applied_before_db_conversion: true
    raw_source_mutated: false
    delivered_is_pre_clipped: false
    configurable: true
    applies_to_paths:
      - "training_adapter"
      - "production_preprocessing"
    both_paths_or_neither: true
    production_path_site: "after radiometric calibration, before linear-to-dB"
    production_path_status: "PENDING(M2 wiring) — contract fixed, step not yet implemented"
    is_m3_feature_level_clamp: false
    m3_clip_to_valid_range_remains_disabled: true
    representations:
      source: "linear sigma0, unclipped"
      preprocessing: "linear sigma0, clipped at 0.15"
      model: "decibel, upper bound -8.2391 dB"

  # ---------------------------------------------------------------------------
  # C11 — LICENSING / DATA REDISTRIBUTION POLICY
  #
  # Upstream licence status is UNRESOLVED for both corpora and is not
  # manufactured here. Kuro Siwo has a four-way discrepancy; Sen1Floods11 has
  # no licence file at all. Those facts are recorded per dataset above.
  #
  # Our policy does not wait for them: nothing is redistributed from this
  # repository either way. That keeps "we do not know what is permitted"
  # separate from "we have decided not to".
  # ---------------------------------------------------------------------------
  redistribution_policy:
    raw_data_stays_external: true
    derived_dataset_copies_committed: false
    sample_tiles_committed: false
    samples_dir_may_hold_training_corpus_samples: false
    metadata_and_config_may_describe_external_paths: true
    docs_may_imply_redistribution: false
    upstream_license_status:
      kuro_siwo: "DISCREPANCY(unresolved)"
      sen1floods11: "UNVERIFIED(no license file upstream)"
    license_manufactured: false
    resolution_required_before:
      - "committing any sample tile"
      - "publishing any derived dataset"

  # ---------------------------------------------------------------------------
  # C12 — LOCAL SUBSET SUFFICIENCY
  #
  # The local Kuro Siwo corpus is INCOMPLETE: 5 of 45 catalogued activations.
  # It is enough to build and test an adapter against; it is not enough to make
  # a scientific claim with. Both halves of that are encoded, because the
  # failure mode is treating the first as licence for the second.
  #
  # The official split is NOT redefined by what happens to be on disk. An
  # activation that is absent locally is MISSING, never "not in the split".
  # ---------------------------------------------------------------------------
  local_subset:
    official_split_modified: false
    official_split_redefined_by_local_availability: false
    absent_activation_is_missing_not_unsplit: true
    development_use_permitted: true
    production_training_run_permitted: false
    threshold_selection_permitted: false
    scientific_model_selection_permitted: false
    must_report_missing_activations: true
    must_resolve_split_by_official_activation_id: true
    activations_present: 5
    activations_catalogued: 45
    train_activations_present: 3
    train_activations_total: 27
    val_activations_present: 1
    val_activations_total: 7
    test_activations_present: 1
    test_activations_total: 10
    train_tile_skew: "1111004 alone is 71% of available train tiles"
    status: "INCOMPLETE — development permitted, claims blocked"

  # ---------------------------------------------------------------------------
  # C8 — DATASET CAPABILITY MODEL
  #
  # Recorded per dataset, under
  # `production.training_datasets.datasets[*].capabilities`, so a capability
  # claim sits next to the evidence for it. The two corpora disagree on eight
  # capability keys; `capability_keys_that_differ` names them so the difference
  # is assertable rather than something a reader has to diff by hand.
  # ---------------------------------------------------------------------------
  capabilities_location: "production.training_datasets.datasets[*].capabilities"
  capability_model_is_a_single_boolean: false
  capability_model_uses_single_validity_form_literal: false
  capability_keys_that_differ:
    - "imagery.optical"
    - "imagery.pre_event"
    - "imagery.temporal_pair"
    - "imagery.change_features"
    - "labels.permanent_water"
    - "labels.separates_flood_from_permanent_water"
    - "labels.multiclass_segmentation"
    - "sar_representation.native"

  # ---------------------------------------------------------------------------
  # C13 / C14 — ADAPTER CONTRACT INVARIANTS
  #
  # Recorded per dataset, under
  # `production.training_datasets.datasets[*].adapter_invariants`, so an
  # invariant cannot drift away from the dataset facts it constrains. 18 for
  # Kuro Siwo, 15 for Sen1Floods11.
  # ---------------------------------------------------------------------------
  adapter_invariants_location: "production.training_datasets.datasets[*].adapter_invariants"
  adapter_invariant_counts:
    kuro_siwo: 18
    sen1floods11: 15

  # ---------------------------------------------------------------------------
  # M4 BASELINE SCOPE — what the frozen contract does and does not cover.
  # ---------------------------------------------------------------------------
  baseline:
    modality: "SAR only"
    dem_input: false
    bundled_slope_input: false
    optical_input: false
    temporal_depth: "1 pre + 1 post"
    label_scheme: "kuro_siwo native 3-class"
    corpus_union_permitted: false
    debris_class_claimed: false
    threshold_inside_model: false

# -----------------------------------------------------------------------------
# VALIDATION-ONLY SOURCES — never production inputs
#
# Present so the boundary is explicit and auditable. Consumed only by the
# evaluation layer, and only after a production prediction exists
# (architecture.md §11).
# -----------------------------------------------------------------------------
validation_only:
  enabled: false
  note: >-
    These sources are for post-hoc comparison only. Importing any of them into
    training, feature construction, preprocessing, inference or threshold
    selection is a critical defect (AGENTS.md §3).
  sources:
    - name: "EMSR927"
      # VERIFIED(spec): the specification identifies EMSR927 as the Copernicus
      # EMS activation for this event and classifies it VALIDATION ONLY. Using
      # it as a production input (training, features, preprocessing, inference
      # or threshold selection) is explicitly prohibited.
      status: "VERIFIED"
      purpose: "post-hoc comparison for the Trishuli case study"
      prohibited_as_production_input: true
      path: null        # TODO: populate only when the comparison milestone starts
    - name: "UNOSAT"
      purpose: "post-hoc comparison"
      path: null
    - name: "post-event OSM edits"
      purpose: "post-hoc comparison of infrastructure change"
      path: null

# -----------------------------------------------------------------------------
# Local storage layout (AGENTS.md §15 — contents are git-ignored)
# -----------------------------------------------------------------------------
paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  samples: "data/samples"
  models: "models"
  artifacts: "artifacts"
