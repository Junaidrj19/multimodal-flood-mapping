        validity_mechanisms_are_redundant: false
        validity_canonical_source: "LabelHand != -1"
        validity_semantics: "LabelHand: -1=invalid/nodata, 0=Not Water, 1=Water"
        # No separate validity raster and no SAR nodata convention are published,
        # so the three-way redundancy that Kuro Siwo offers does not exist here.
        # The adapter gets ONE validity source and must not invent the others.
        validity_integrity_assertions: []
        validity_integrity_verified_on_delivered_data: false
        separates_permanent_from_flood_water: false
        has_debris_or_sediment_class: false
        upstream_label_provenance: >-
          446 hand-annotated chips; plus 4385 weak chips from Otsu thresholding
          of the S1 VH band, 4385 weak chips from traditional Sentinel-2
          classification, and 815 permanent-water chips derived from the JRC
