        license_declared:
          repository_license_file: "ABSENT"
          repository_readme: "no licence statement"
          paper: "CVF boilerplate only; no dataset licence"
          challenge_specification: "CC BY 4.0"
        license_conservative: "UNDETERMINED — no redistribution right established"
        license_status: "UNVERIFIED(no license file upstream)"
        redistribution_permitted: false
        citation: "Bonafilia et al., 2020 (CVPRW 2020)"
        # VERIFIED(source) — primary sources, see docs/dataset-registry.md §1.5.2
        sensors: ["sentinel-1", "sentinel-2"]
        bundled_dem: null
        optical: true
        polarisations: ["VV", "VH"]
        product_levels: ["GRD"]
        tile_size_px: 512
        crs: "EPSG:4326"
        # ---------------------------------------------------------------------
        # GEOMETRY — CORRECTED 2026-10-08 for the same defect that was fixed on
        # the Kuro Siwo side.
        #
        # An earlier revision recorded `resolution_m: 10` for a corpus whose CRS
        # is EPSG:4326. A geographic CRS has no metre spacing at all: the grid
        # step is ~0.000090 DEGREES, and a degree of longitude shrinks with
        # cos(lat) exactly as Web Mercator's metre grows with 1/cos(lat). So
        # `resolution_m: 10` was a unit error, not merely an approximation, and
        # it would have told the adapter that a Sen1Floods11 pixel, a Kuro Siwo
        # pixel and a 10 m UTM pixel were interchangeable. None of the three are.
        #
        # Unlike the Kuro Siwo case this is not backed by a local delivery: the
        # dataset is deliberately NOT present in this repository (C11), so the
        # spacing is recorded from the published description and marked as such.
        # ---------------------------------------------------------------------
        source_crs: "EPSG:4326"
        source_pixel_spacing_degrees: 0.000090
        source_pixel_spacing_is_true_ground_metres: false
        source_pixel_spacing_status: "VERIFIED(source) — not measured on a delivery"
        true_ground_spacing_m:
          status: "PER_CHIP — not a corpus constant"
          derivation: "0.000090 deg * 111320 * cos(lat) east-west; ~10.02 m north-south"
          measured: {}          # no local delivery; nothing measured (C11)
          note: >-
            North-south spacing is ~10 m everywhere; east-west spacing falls
            with latitude. The adapter must derive spacing per chip from the
            chip's own transform and centre latitude, never assume 10 m.
        # Google Earth Engine S1 GRD preprocessing: thermal noise removal,
        # radiometric calibration, terrain correction, then 10*log10 log scaling.
        backscatter_representation: "decibel"
        backscatter_representation_status: "VERIFIED(source) — README states 'Unit: dB'"
        optical_processing_level: "L1C"      # TOA reflectance, NOT L2A surface
        optical_bands: "all 13 (B1-B12 incl. B8A)"
        optical_scaling: "TOA reflectance scaled by 10000"
        optical_quality_mask_included: false
        # S1 and S2 acquisition dates are close but NOT always identical;
        # observed offsets of up to 2 days across events.
        s1_s2_dates_identical: false
        temporal_structure: "single post-event acquisition (no pre-event image)"
        label_classes:            # recorded verbatim, including the -1 sentinel
          -1: "No Data / Not Valid"
          0: "Not Water"
          1: "Water"
        # The same semantic/stored/nodata split that Kuro Siwo needs, stated in
        # the same shape so the two can be compared field by field rather than
        # by reading prose. Sen1Floods11's sentinel is IN-BAND and NEGATIVE,
        # which is a different mechanism from Kuro's in-band positive 3 and from
        # Kuro's separate MK0_MNA raster. They are not interchangeable.
        label_semantic_values: [0, 1]
        label_stored_values: [-1, 0, 1]
        label_nodata_value: -1
        label_values_are_exhaustive: false
        label_nodata_is_a_semantic_class: false
        label_is_binary: true
        validity_mechanisms:
