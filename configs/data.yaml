# =============================================================================
# configs/data.yaml — data acquisition and source configuration
#
# Multimodal AI Hackathon 2026, Track B.
#
# STATUS: partially verified. Values confirmed against the official Track B
# challenge specification are marked VERIFIED(spec). Values still unconfirmed
# remain `null` with a TODO note. Nothing is populated from assumption.
#
# SPEC FIELD-NAME MAPPING. The challenge specification names four values that
# this file stores under its existing nested keys rather than duplicating at
# the top level (one source of truth per value):
#   event_date                 -> event.date
#   osm_snapshot_date          -> production.osm.snapshot_date
#   dem_source                 -> production.dem.product
#   allowed_training_datasets  -> production.training_datasets.allowed_training_datasets
#
# DATA RULE (AGENTS.md §3, architecture.md §18): the `production` block may
# contain ONLY Sentinel-1, Sentinel-2, Copernicus DEM, pre-event OSM and
# permitted training datasets. Validation-only sources live in a separate
# `validation_only` block and must never be read by training, feature
# construction, preprocessing, inference or threshold selection.
# =============================================================================

version: 0.1.0

# -----------------------------------------------------------------------------
# MANDATORY ATTRIBUTION (AGENTS.md §18)
#
# VERIFIED(spec). These three strings must appear on every submitted artifact,
# dashboard view and situation report. They are reproduced here so that config
# consumers can emit them, but the ENFORCING copy lives in
# `src/floodmap/utils/provenance.py::REQUIRED_ATTRIBUTIONS`, which attaches
# them to every artifact automatically. `tests/test_configs.py` asserts the two
# copies are byte-identical so they cannot drift apart.
#
# DISCREPANCY NOTE (unresolved — do not "tidy" without checking the spec PDF):
# the WorldDEM-30 string below includes "© DLR e.V.", matching AGENTS.md §18
# and README.md §12. A later restatement of the specification omitted that "©".
# The form with "©" is used here because AGENTS.md is this project's declared
# source of truth (§2) and because dropping a copyright mark from a required
# attribution is a legal defect rather than a stylistic choice. Confirm against
# the official specification document before submission.
# -----------------------------------------------------------------------------
attribution:
  required:
    - "Contains modified Copernicus Sentinel data 2026."
    - "Produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved."
    - "© OpenStreetMap contributors."

# -----------------------------------------------------------------------------
# Area of interest and event
# -----------------------------------------------------------------------------
aoi:
  # TODO(verify): the challenge specification is not present in this repository,
  # so no AOI geometry is defined. Do not invent coordinates.
  name: null
  # One of: bbox | geojson_path | named_region. The M1 acquisition interface
  # accepts caller-supplied EPSG:4326 bbox/Polygon geometry; the case-study
  # geometry itself remains deliberately unset.
  representation: null
  bbox: null          # [min_lon, min_lat, max_lon, max_lat] when representation=bbox
  geojson_path: null  # path under data/ when representation=geojson_path
  crs: "EPSG:4326"    # Assumption: AOI expressed in geographic coordinates. Revisit if the
                      # challenge specifies otherwise.

event:
  # Primary case study is the August 2026 Trishuli flood, Nepal (README.md §9).
  name: "Trishuli flood, Nepal"
  # VERIFIED(spec): event date fixed by the official Track B specification.
  date: "2026-08-26"       # ISO 8601
  # TODO(verify): the spec fixes the event date but not the acquisition search
  # window. Derive these from actual Sentinel revisit availability around
  # event.date; do not guess.
  window_before_days: null
  window_after_days: null

# -----------------------------------------------------------------------------
# EARTH OBSERVATION ACQUISITION (Milestone 1)
#
# `aoi` is deliberately null until an operator supplies the judge-selected
# geometry. Search windows are per sensor and remain null until availability
# around the requested event is inspected; the CLI accepts explicit overrides.
# Catalogue credentials are environment-variable names, never secrets in Git.
# -----------------------------------------------------------------------------
acquisition:
  aoi: null
  provider:
    name: "cdse-odata"
    catalogue_url: "https://catalogue.dataspace.copernicus.eu/odata/v1/Products"
    download_url_template: "https://download.dataspace.copernicus.eu/odata/v1/Products({product_id})/$value"
    timeout_seconds: 60
    max_results: 200
    page_size: 100
    credentials:
      username_env: "CDSE_USERNAME"
      password_env: "CDSE_PASSWORD"
  sentinel1:
    enabled: true
    search_window:
      before_days: null
      after_days: null
    product_types: ["IW_GRDH_1S"]
    selection_strategy: "nearest_in_time"
    require_same_relative_orbit: true
    on_no_same_track_pair: "fail"
  sentinel2:
    enabled: true
    search_window:
      before_days: null
      after_days: null
    product_types: ["S2MSI2A", "S2MSI1C"]
    # Explicit policy: prefer the least cloudy qualifying scene, then nearest
    # in time. A provider cloud value is metadata only; AOI cloud is measured
    # later from the delivered cloud mask during preprocessing.
    selection_strategy: "least_cloud_then_nearest"
    max_scene_cloud_percent: null
    require_same_relative_orbit: false
    on_no_same_track_pair: "record"
  download:
    enabled: false
    destination: "data/raw"

# -----------------------------------------------------------------------------
# PRODUCTION INPUTS — permitted sources only
# -----------------------------------------------------------------------------
production:

  sentinel1:
    enabled: true
    # TODO(verify): product type and polarisations against the challenge spec.
    product_type: null        # e.g. GRD — VERIFY
    polarisations: null       # e.g. [VV, VH] — VERIFY
    # AGENTS.md §4: prefer the same orbit track for change detection.
    require_same_relative_orbit: true
    # If no same-track pair exists, fail explicitly rather than silently
    # comparing different geometries (architecture.md §17).
    on_no_same_track_pair: "fail"   # fail | warn_and_continue
    relative_orbit: null
    orbit_direction: null
    target_resolution_m: null       # TODO(verify)

  sentinel2:
    enabled: true
    processing_level: null      # e.g. L2A — VERIFY
    bands: null                 # TODO(verify) against label/feature requirements
    max_scene_cloud_percent: null   # TODO: choose from data availability, not guessed
    cloud_mask_source: null     # TODO(verify) which mask product is used
    target_resolution_m: null

  dem:
    enabled: true
    # VERIFIED(spec): the challenge specification fixes the DEM source.
    # Attribution for this product is mandatory — see the `attribution` block.
    product: "Copernicus WorldDEM-30"
    # TODO(verify): the spec names the product but not the release/version tag
    # of the copy that will actually be downloaded. Record it at acquisition
    # time from the provider response, not from assumption.
    version: null
    # TODO(verify): "30" in the product name denotes ~30 m nominal spacing, but
    # the delivered grid and CRS must be read from the asset itself rather than
    # inferred from the name.
    resolution_m: null
    crs: null
    derivatives: []             # e.g. [slope, aspect, flow_direction] — add only when used

  osm:
    enabled: true
    # AGENTS.md §3: the snapshot MUST predate the event.
    # VERIFIED(spec): pre-event snapshot date fixed by the specification.
    # 2026-07-27 < event.date (2026-08-26), so the pre-event constraint holds.
    snapshot_date: "2026-07-27"   # ISO 8601; must be < event.date
    # VERIFIED(spec): historical extract retrieved via the ohsome API, which
    # serves time-sliced OSM history and therefore can return a genuine
    # pre-event state rather than a current-day planet extract.
    snapshot_source: "ohsome API"
    layers:
      buildings: true
      roads: true
      bridges: true
    # Hard guard: post-event OSM edits are validation-only.
    allow_post_event_edits: false

  training_datasets:
    # VERIFIED(spec): the permitted training datasets are enumerated by the
    # official Track B challenge specification. This resolves the blocking
    # UNKNOWN previously recorded here and in docs/dataset-registry.md §1.5.
    # Adding any dataset NOT in this list is a data-governance violation.
    allowed_training_datasets:
      - "kuro_siwo"
      - "sen1floods11"
    # Per-dataset detail. `role` is from the specification; `license` and
    # `citation` are required by AGENTS.md §18 ("Training datasets must be
    # cited according to their respective licenses and papers").
    #
    # VERIFIED(source) values below were read from the datasets' own primary
    # sources — repository files, LICENSE files and the published papers — not
    # from the challenge specification and not from recollection. The audit and
    # its source URLs are in docs/dataset-registry.md §1.5.
    # Properties that still require opening a delivered label raster or the
    # paper supplement remain TODO(verify).
    datasets:
      - id: "kuro_siwo"
        name: "Kuro Siwo"
        role: "production_training_input"
        required: true
        # LICENSE DISCREPANCY — UNRESOLVED. Do not collapse to one identifier.
        #   repository LICENSE file : MIT (Copyright (c) 2024 Orion Lab)
        #   repository README       : "The Kuro Siwo dataset is released under
        #                              the CC BY license" (no version given)
        #   paper body              : "Kuro Siwo is released under the MIT License"
        #   challenge specification : "MIT"
        # Conservative reading: treat the CODE as MIT and the DATA as CC BY
        # (attribution required), because CC BY is the more restrictive of the
        # two for data reuse. Attribution is required under either reading, so
        # requiring it is safe; assuming MIT for the data would not be.
        license_declared:
          repository_license_file: "MIT"
          repository_readme: "CC BY (version unstated)"
          paper_body: "MIT"
          challenge_specification: "MIT"
        license_conservative: "CC BY (data) + MIT (code) — attribution required"
        license_status: "DISCREPANCY(unresolved)"
        redistribution_permitted: null   # Do NOT commit samples until resolved.
        citation: "Bountos et al., 2024 (NeurIPS 2024)"
        citation_doi: "10.52202/079017-1204"
        # VERIFIED(source) — primary sources, see docs/dataset-registry.md §1.5.1
        sensors: ["sentinel-1"]
        bundled_dem: "SRTM 1Sec"        # NOT Copernicus WorldDEM-30; see §1.5.3
        optical: false
        polarisations: ["VV", "VH"]
        product_levels: ["GRD", "SLC"]
        resolution_m: 10
        tile_size_px: 224
        crs: "EPSG:3857"
        # VERIFIED from four independent lines of evidence. No sentence in the
        # paper states the scale in words, but the numeric evidence is decisive:
        #   1. configs/grd_preprocessing.xml: Calibration sets
        #      outputImageScaleInDb=false, outputSigmaBand=true, and the graph
        #      contains no LinearToFromdB node.
        #   2. configs/train/data_config.json publishes per-channel statistics
        #      data_mean [VV, VH] = [0.0953, 0.0264] and
        #      data_std  [VV, VH] = [0.0427, 0.0215].
        #      Decibel VV backscatter would sit near -10 to -15, not +0.095.
        #   3. Supplemental Material §5: "All SAR images were clipped at a max
        #      value of 0.15 and normalized to 0 mean and 1 standard deviation."
        #      A 0.15 ceiling is meaningful for linear power and nonsensical for
        #      dB. The loader clamps with min=0.0, which would delete dB data.
        #   4. The default scale_input is "normalize" (plain z-score); the
        #      optional "custom" path applies torch.log TO the stored values,
        #      which is only coherent if they are linear.
        backscatter_representation: "linear"
        backscatter_representation_status: "VERIFIED(numeric evidence; not stated in prose)"
        published_channel_statistics:
          note: >-
            Published by the authors for linear sigma-nought, clipped at 0.15.
            Recorded for adapter cross-checking: a delivered raster whose
            distribution does not match these is not what we think it is.
          data_mean: {vv: 0.0953, vh: 0.0264}
          data_std: {vv: 0.0427, vh: 0.0215}
          clamp_max: 0.15
          default_scaling: "normalize (z-score), no log transform"
        temporal_structure: "triplet: 2 pre-event + 1 post-event"
        # CORRECTION (verified in the repository): the stored label mask carries
        # ONLY {0, 1, 2}. Validity is a SEPARATE binary raster, not a label
        # value. An earlier revision of this file recorded "3: Invalid pixels"
        # as if 3 were a stored class with ignore_index semantics. That was
        # wrong, and it mattered: an adapter built on it would have filtered
        # label==3 (finding nothing) and silently trained on invalid pixels.
        #   - HuggingFace Kuro-Siwo-Webdataset card:
        #       mask.npy       -> "0: no water, 1: permanent water, 2: flood"
        #       valid_mask.npy -> "0: invalid, 1: valid"
        #   - dataset/Dataset.py loads valid_mask as its own raster, carries it
        #     separately through augmentation, and applies `valid_mask == 1`.
        #   - CLASS_LABELS in training/segmentation_trainer.py does contain a
        #     `3: "Invalid pixels"` entry, but CLASS_LABELS[3] is NEVER
        #     referenced anywhere in the codebase; only [0], [1], [2] are used.
        #   - No `ignore_index` key exists in any config file in the repository.
        label_classes:
          0: "No water"
          1: "Permanent Waters"
          2: "Floods"
        label_values_are_exhaustive: true
        validity_representation: "separate_binary_raster"   # NOT a label value
        validity_semantics: "valid_mask.npy: 0=invalid, 1=valid"
        separates_permanent_from_flood_water: true
        has_debris_or_sediment_class: false
        # DISCLOSURE ONLY — not a data path, not a loader, not an input.
        # This field records where the UPSTREAM AUTHORS' labels came from. It is
        # material because it means our training labels inherit Copernicus EMS
        # interpretation assumptions second-hand, which weakens the claimed
        # independence of any later EMS-family comparison. Recording it is a
        # disclosure obligation; acting on it would be a violation. See
        # docs/dataset-registry.md §1.5.4 and docs/evaluation-protocol.md §7.3.
        upstream_label_provenance: >-
          Manual photointerpretation of the preprocessed GRD images by five SAR
          experts at an annotation scale of 1:1000, initialised from Copernicus
          EMS shapefiles where available. Each expert annotated one of five
          partitions and quality-checked another's, supervised by a senior
          remote-sensing scientist, with group meetings to resolve discrepancies.
          The upstream authors note that errors in those annotations are
          apparent, and report agreement with CEMS of only 51% IoU for permanent
          water and 48% IoU for flood. No EMS product is retrieved, read or
          referenced by this pipeline; only the authors' finished labels are
          consumed.
        split_type: "event_and_geography_based"
        official_split_activation_ids:
          test: [321, 561, 445, 562, 411, 1111002, 277, 1111007, 205, 1111013]
          val: [514, 559, 279, 520, 437, 1111003, 1111008]
        # GOVERNANCE: activation 1111007 is labelled act_region "Nepal" and sits
        # in the UPSTREAM TEST split. It must not enter our training or
        # validation split. Its only AOI is named "Patna" and its climate zone
        # is tropical, so it is very likely lowland Ganges-plain terrain rather
        # than Himalayan; treat it as NOT satisfying our unseen-Himalaya
        # requirement until the AOI geometry is inspected.
        upstream_test_activations_are_offlimits: true
        # VERIFIED by reading the repository: the three lists are pairwise
        # disjoint and together cover 44 activation ids, all of which appear in
        # catalogue/catalogue.yaml. Two bookkeeping discrepancies, recorded
        # rather than smoothed over:
        #   - the catalogue holds 45 activation ids, so exactly one
        #     (1111012, Australia / Singleton) belongs to NO split and must not
        #     be used without an explicit decision;
        #   - the paper says "43 flood events" while the catalogue lists 45 ids,
        #     so "activation" and "event" are not one-to-one. Any per-event
        #     count we publish must say which of the two it means.
        split_verification:
          train_count: 27
          val_count: 7
          test_count: 10
          union_count: 44
          pairwise_disjoint: true
          all_split_ids_present_in_catalogue: true
          catalogue_activation_id_count: 45
          activations_in_no_split: [1111012]
          paper_stated_event_count: 43
        # Supplemental Material §4 WAS located and read. It describes the
        # annotation PROCESS but does not publish the decision RULES: it states
        # that photointerpretation keys were extracted, without listing them.
        # So the operational Floods-vs-Permanent-Waters boundary remains
        # unpublished and our Floods class semantics inherit an undocumented
        # judgement. Treat this as a permanent limitation, not a pending task.
        flood_definition: "UNPUBLISHED — process documented, decision keys not released"
        flood_definition_known:
          permanent_water_reference: >-
            NONE. No external water layer (JRC/Pekel or similar) was used. The
            authors discuss adding a permanent-water layer as FUTURE work and
            warn a static layer "could potentially impute noise". The
            distinction was made by expert photointerpretation of the SAR time
            series alone, which is why it is reproducible only in spirit.
          includes_wet_soil_or_submerged_vegetation: "UNSTATED"
          sediment_laden_or_muddy_water: "NOT MENTIONED ANYWHERE"
          artifact_flagging_criteria: "referenced but not published"
        # No quantitative inter-annotator agreement (e.g. Cohen's kappa) and no
        # label-noise estimate are reported. The 51%/48% IoU figures are
        # agreement with CEMS, which the authors treat as the lower-quality
        # product — not an agreement measure among their own annotators.
        stated_label_noise: "NONE REPORTED (no kappa, no noise estimate)"
        # Per-event imaging geometry is held constant by the authors:
        # "all three SAR images belong to either the descending or ascending
        # imaging geometry to prevent variations in layover, foreshortening and
        # shadow effects". This matches our own same-relative-orbit rule.
        imaging_geometry_constraint: "single pass direction per event"
        path: null                 # TODO: populate when actually acquired
      - id: "sen1floods11"
        name: "Sen1Floods11"
        role: "optional_training_input"
        required: false
        # LICENSE GAP — MORE SERIOUS THAN A DISCREPANCY.
        # The repository contains NO LICENSE file: the GitHub API reports
        # "license": null and the root listing has no LICENSE/COPYING file. The
        # README makes no licence statement. The CVPR page carries only the
        # CVF's standard "rights retained by authors" boilerplate, which covers
        # the paper rather than the data. The challenge specification's
        # "CC BY 4.0" could NOT be confirmed against any primary source.
        # Conservative reading: no redistribution right is established. Use is
        # permitted (the data is published openly by the authors) but the data
        # must not be re-published from this repository, and the licence must be
        # resolved with the authors before any sample is committed.
        license_declared:
          repository_license_file: "ABSENT"
          repository_readme: "no licence statement"
          paper: "CVF boilerplate only; no dataset licence"
          challenge_specification: "CC BY 4.0"
        license_conservative: "UNDETERMINED — no redistribution right established"
        license_status: "UNVERIFIED(no license file upstream)"
        redistribution_permitted: false
        citation: "Bonafilia et al., 2020 (CVPRW 2020)"
        # VERIFIED(source) — primary sources, see docs/dataset-registry.md §1.5.2
        sensors: ["sentinel-1", "sentinel-2"]
        bundled_dem: null
        optical: true
        polarisations: ["VV", "VH"]
        product_levels: ["GRD"]
        resolution_m: 10
        tile_size_px: 512
        crs: "EPSG:4326"
        # Google Earth Engine S1 GRD preprocessing: thermal noise removal,
        # radiometric calibration, terrain correction, then 10*log10 log scaling.
        backscatter_representation: "decibel"
        backscatter_representation_status: "VERIFIED(source) — README states 'Unit: dB'"
        optical_processing_level: "L1C"      # TOA reflectance, NOT L2A surface
        optical_bands: "all 13 (B1-B12 incl. B8A)"
        optical_scaling: "TOA reflectance scaled by 10000"
        optical_quality_mask_included: false
        # S1 and S2 acquisition dates are close but NOT always identical;
        # observed offsets of up to 2 days across events.
        s1_s2_dates_identical: false
        temporal_structure: "single post-event acquisition (no pre-event image)"
        label_classes:
          -1: "No Data / Not Valid"
          0: "Not Water"
          1: "Water"
        separates_permanent_from_flood_water: false
        has_debris_or_sediment_class: false
        upstream_label_provenance: >-
          446 hand-annotated chips; plus 4385 weak chips from Otsu thresholding
          of the S1 VH band, 4385 weak chips from traditional Sentinel-2
          classification, and 815 permanent-water chips derived from the JRC
          surface-water dataset.
        split_type: "event_based"
        events: 11                 # 12 entries in the metadata; Colombia added later
        path: null                 # TODO: populate when actually acquired

# -----------------------------------------------------------------------------
# VALIDATION-ONLY SOURCES — never production inputs
#
# Present so the boundary is explicit and auditable. Consumed only by the
# evaluation layer, and only after a production prediction exists
# (architecture.md §11).
# -----------------------------------------------------------------------------
validation_only:
  enabled: false
  note: >-
    These sources are for post-hoc comparison only. Importing any of them into
    training, feature construction, preprocessing, inference or threshold
    selection is a critical defect (AGENTS.md §3).
  sources:
    - name: "EMSR927"
      # VERIFIED(spec): the specification identifies EMSR927 as the Copernicus
      # EMS activation for this event and classifies it VALIDATION ONLY. Using
      # it as a production input (training, features, preprocessing, inference
      # or threshold selection) is explicitly prohibited.
      status: "VERIFIED"
      purpose: "post-hoc comparison for the Trishuli case study"
      prohibited_as_production_input: true
      path: null        # TODO: populate only when the comparison milestone starts
    - name: "UNOSAT"
      purpose: "post-hoc comparison"
      path: null
    - name: "post-event OSM edits"
      purpose: "post-hoc comparison of infrastructure change"
      path: null

# -----------------------------------------------------------------------------
# Local storage layout (AGENTS.md §15 — contents are git-ignored)
# -----------------------------------------------------------------------------
paths:
  raw: "data/raw"
  interim: "data/interim"
  processed: "data/processed"
  samples: "data/samples"
  models: "models"
  artifacts: "artifacts"
