limitations:
- 'Main stem only: tributaries are excluded by the approved policy, so a flood that moved up a tributary
  valley is outside this extent.'
- 'The downstream end is an instrument boundary (the delivered product coverage), not a hydrological node:
  the corridor''s continuation beyond it is unobserved here.'
- Corridor width is the M6.2-M6.5 1 km half-width, carried over for comparability; it is not yet an operator-ratified
  parameter.
- 'HydroRIVERS is a 15 arc-second (~460 m at this latitude) product: the centreline is a coarse delineation,
  not a surveyed river bank, so edge exposure is approximate at the buffer margin.'
- The reference coordinate is a published site coordinate for the border crossing (~150 m site uncertainty),
  not a surveyed river station.
