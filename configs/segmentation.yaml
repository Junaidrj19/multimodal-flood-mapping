# =============================================================================
# configs/segmentation.yaml — flood/debris segmentation
#
# STATUS: structural placeholder.
#
# AGENTS.md §5: do not select a model because it is fashionable. No architecture
# is chosen here. `architecture: null` is a deliberate statement that the
# decision has not been made, not an omission to be filled in casually.
# architecture.md §6 likewise declines to lock the project to one network.
#
# Before a model is committed to, AGENTS.md §5 requires establishing: label
# compatibility, input modality compatibility, spatial resolution,
# train/test split, compute requirements, baseline performance and
# unseen-Himalaya performance.
# =============================================================================

version: 0.1.0

# -----------------------------------------------------------------------------
# Classes
#
# FROZEN 2026-10-08. The class set is Kuro Siwo's native 3-class scheme, which
# is the primary supervised corpus (configs/data.yaml -> m4_contract.baseline).
#
# THE DISTINCTION THAT MATTERS HERE, because this repository got it wrong twice
# in opposite directions:
#   - the SEMANTIC classes are {0, 1, 2}. 3 is NOT a fourth class, and treating
#     it as one would train a phantom category;
#   - the STORED label values are {0, 1, 2, 3}, and 3 is an in-band NODATA
#     sentinel occupying 6.48% of label pixels. Treating it as absent would
#     feed an undeclared value into a fixed-width softmax.
# `ignore_index: 3` is the narrow truth in between. It is an INPUT-side
# concern — the value to exclude from loss and metrics — and is deliberately
# NOT the same number as the output nodata below.
# -----------------------------------------------------------------------------
classes:
  names:
    - "No water"            # 0
    - "Permanent Waters"    # 1
    - "Floods"              # 2
  semantic_values: [0, 1, 2]
  # Identity for Kuro Siwo: its native values already are our class indices.
  # Stated explicitly rather than left implicit, so a future corpus with a
  # different encoding has somewhere to declare it.
  label_mapping:
    0: 0
    1: 1
    2: 2
  ignore_index: 3
  ignore_index_is_the_input_label_sentinel: true
  ignore_index_is_a_semantic_class: false
  source_corpus: "kuro_siwo"

# -----------------------------------------------------------------------------
# Output nodata — C9, FROZEN 2026-10-08
#
# Semantic class IDs and "no information here" are different kinds of thing and
# get different encodings. A class ID reused as nodata makes every downstream
# count ambiguous: a pixel labelled 0 could mean "we observed dry ground" or
# "we had nothing to say", and no consumer could tell them apart.
#
# 255 is chosen for the class mask because it cannot collide with {0,1,2} nor
# with the upstream input sentinel 3 in a uint8 raster. The input sentinel is
# deliberately NOT reused as the output sentinel, so a raster's provenance
# stays readable from its values.
#
# -9999.0 is outside the legitimate range of every continuous output: decibel
# backscatter, decibel change and a probability in [0, 1].
# -----------------------------------------------------------------------------
output:
  class_mask_dtype: "uint8"
  class_mask_nodata: 255
  probability_dtype: "float32"
  probability_nodata: -9999.0
  forbid_semantic_class_id_as_nodata: true
  distinct_from_input_label_sentinel: true
  input_label_sentinel: 3

# -----------------------------------------------------------------------------
# Model — intentionally unselected
# -----------------------------------------------------------------------------
model:
  architecture: null        # NOT SELECTED. Must follow measured performance (AGENTS.md §5).
  encoder: null
  pretrained_weights: null
  in_channels: null         # follows from the feature stack, once defined
  # Derived from the frozen semantic class set {0,1,2}, not a model choice.
  # Note it is 3 because there are three SEMANTIC classes; the label nodata
  # sentinel 3 is excluded via `classes.ignore_index` and gets no logit.
  num_classes: 3
  # Candidate architectures to compare experimentally. Empty on purpose: listing
  # candidates now would imply an evaluation that has not happened.
  candidates: []

# -----------------------------------------------------------------------------
# Input features
#
# Must reference only permitted production sources (AGENTS.md §3).
# -----------------------------------------------------------------------------
features:
  sentinel1: []             # e.g. [vv_pre, vv_post, vv_ratio] — define in features milestone
  sentinel2: []
  indices: []               # e.g. NDWI — add only with a stated justification
  terrain: []
  # Normalisation statistics must be computed on TRAINING data only and reused
  # unchanged at inference; computing them over the evaluation scene would be
  # test-time leakage.
  #
  # C5 FROZEN 2026-10-08 — the ARTIFACT SCHEMA, not the method and not the
  # values. `method` stays null because normalisation is deliberately NOT part
  # of the frozen contract, and `statistics_path` stays null because NO FITTED
  # STATISTICS EXIST. Inventing either would be the exact failure this freeze
  # is meant to prevent.
  #
  # Three KINDS of statistics exist and must never be conflated:
  #   reference  - published upstream values. Tolerance-banded cross-check only,
  #                and explicitly NOT usable as our fitted parameters: their
  #                pre/post, split and aggregation bases are all unstated.
  #   fitted     - OUR parameters, from the training split only.
  #   validation - measured on validation data for DRIFT REPORTING only.
  #
  # The layout is a SIDECAR PAIR rather than one wrapped file, and that is
  # forced rather than chosen: floodmap.features.pipeline coerces float() over
  # every value of every top-level key in the values file, so an embedded
  # provenance block would raise there. It also matches the repository's
  # existing `*_provenance.yaml` convention.
  normalisation:
    method: null
    statistics_source: "training_split_only"
    statistics_path: null
    statistics_schema_id: "floodmap.statistics/1"
    statistics_schema_version: "1.0.0"
    statistics_layout: "sidecar_pair"
    statistics_values_file: "statistics.json"
    statistics_provenance_file: "statistics_meta.json"
    statistics_kinds: ["reference", "fitted", "validation"]
    fitted_statistics_exist: false
    reference_statistics_usable_as_fitted_parameters: false
    is_part_of_frozen_contract: false

# -----------------------------------------------------------------------------
# Training
# -----------------------------------------------------------------------------
training:
  seed: null                # set explicitly for reproducibility (AGENTS.md §14)
  deterministic: true
  epochs: null
  batch_size: null
  optimizer: null
  learning_rate: null
  lr_schedule: null
  loss: null
  augmentation: []
  early_stopping:
    enabled: null
    # C6 — must be a validation metric, never the Himalaya holdout and never
    # the external-validation corpus.
    monitor: "val_iou_flood_class"
    patience: null
  # Checkpoint selection monitors VALIDATION only. Selecting on the unseen
  # Himalayan set would convert it into a tuning set and void the evaluation
  # (AGENTS.md §5, docs/evaluation-protocol.md).
  #
  # C6 FROZEN: the criterion is flood-class IoU, for the reason given in
  # configs/evaluation.yaml -> threshold_selection. Selecting on a macro
  # average over the two easy classes could improve while flood IoU degrades.
  # The criterion is frozen; running it is still blocked on validation data —
  # one activation (19 tiles) cannot support checkpoint selection.
  checkpoint:
    monitor: "val_iou_flood_class"
    mode: "max"
    selection_split: "validation"
    forbid_selection_on_external_validation: true
    forbid_selection_on_test: true
    blocked_on_validation_data: true
    save_dir: "models"

# -----------------------------------------------------------------------------
# Inference
# -----------------------------------------------------------------------------
inference:
  tile_size: null
  tile_overlap: null
  batch_size: null
  # Decision threshold. TODO: selected on the validation split in the evaluation
  # milestone and recorded with the procedure used. Not guessed here
  # (docs/evaluation-protocol.md).
  probability_threshold: null
  output_probability_raster: true
  output_class_mask: true

# -----------------------------------------------------------------------------
# Reproducibility metadata recorded with every inference
# -----------------------------------------------------------------------------
tracking:
  record_provenance: true
  provenance_schema: "floodmap.utils.provenance.ArtifactProvenance"
  record_fields:
    - dataset
    - split
    - features
    - model
    - hyperparameters
    - seed
    - metrics
    - checkpoint
