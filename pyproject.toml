[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "floodmap"
version = "0.1.0"
description = "Flood damage and accessibility intelligence from permitted satellite, terrain and pre-event OSM data (Multimodal AI Hackathon 2026, Track B)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TODO: license not yet chosen for this repository" }
authors = [{ name = "Mohammed Junaid" }]

# Runtime dependencies for the implemented acquisition, provenance and M2
# raster-preprocessing stages. Dependencies for later vector/model stages
# remain deliberately deferred.
dependencies = [
    "numpy>=1.26",
    "pydantic>=2",
    "pyyaml>=6",
    "requests>=2.31",
    "rasterio>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "black>=24",
]

# Additional geospatial stack — declared but not installed by the base M2
# implementation, and not yet pinned.
#
# M2 uses rasterio directly. These remain listed for later vector/array stages.
#
# TODO(verify-before-use): pin exact versions only after verifying, on the
# target Python and OS, that:
#   - the GDAL/PROJ binary wheels resolve without system packages;
#   - rasterio and pyproj agree on the bundled PROJ data version;
#   - geopandas/shapely/pyproj versions are mutually compatible.
# Pinning these now, untested, would be a fabricated claim about the
# environment. See docs/data-contract.md for the per-source requirements that
# will determine which of these are actually needed.
geo = [
    "rasterio",
    "rioxarray",
    "xarray",
    "geopandas",
    "shapely",
    "pyproj",
    "osmnx",
    "networkx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
